plugins { id 'com.android.application' }
android {
    namespace 'org.openxwa.xwaduellvr'
    compileSdk 35
    buildToolsVersion '33.0.1'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.openxwa.xwaduellvr'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '3.7-M7-menu-b'
        ndk { abiFilters 'arm64-v8a' }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/engineJni')
    sourceSets.main.java.srcDir "C:/OpenXWA/third_party/SDL3/android-project/app/src/main/java"
    buildTypes { debug { debuggable true } }
}
// Native build: run Build-Target.ps1 first, then gradlew assembleDebug.
tasks.register('buildDuelNative') { enabled = false }
tasks.named('preBuild').configure { }
